<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMPT Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="app">
        <div id="name-entry" class="screen active">
            <h1>Welcome to the KMPT Game!</h1>
            <p>Enter your name to join</p>
            <input type="text" id="player-name" placeholder="Your name">
            <button id="join-game">Join Game</button>
            <div id="waiting-message" class="hidden">
                <p>Waiting for 3 more players...</p>
                <div id="current-players"></div>
            </div>
        </div>
        <!-- Add this to your waiting screen -->
        <div id="waiting-screen" class="screen">
            <h2>Game Lobby</h2>
            <div class="player-list">
                <h3>Joined Players (<span id="player-count">1</span>/4)</h3>
                <ul id="player-names"></ul>
            </div>
            <div class="status-message">
                <p id="waiting-text">Waiting for more players to join...</p>
                <div class="loader"></div>
            </div>
            <button id="force-start" class="hidden">Force Start (Admin)</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="header">
                <h2>Round: <span id="round-number">1</span>/10</h2>
                <button id="reset-game" class="reset-btn">X</button>
            </div>

            <div id="game-board">
                <div class="tile-row">
                    <div class="tile" data-index="0"></div>
                    <div class="tile" data-index="1"></div>
                </div>
                <div class="tile-row">
                    <div class="tile" data-index="2"></div>
                    <div class="tile" data-index="3"></div>
                </div>
            </div>

            <div id="player-info">
                <div class="player-score" data-player="0">
                    <span class="player-name"></span>: <span class="score">0</span>
                </div>
                <div class="player-score" data-player="1">
                    <span class="player-name"></span>: <span class="score">0</span>
                </div>
                <div class="player-score" data-player="2">
                    <span class="player-name"></span>: <span class="score">0</span>
                </div>
                <div class="player-score" data-player="3">
                    <span class="player-name"></span>: <span class="score">0</span>
                </div>
            </div>

            <div id="police-guess" class="hidden">
                <h3>Police: Guess who is the Thief</h3>
                <div class="guess-options"></div>
                <button id="submit-guess">Submit Guess</button>
            </div>

            <div id="game-over" class="hidden">
                <h2>Game Over!</h2>
                <p>The winner is: <span id="winner-name"></span></p>
                <button id="play-again">Play Again</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
